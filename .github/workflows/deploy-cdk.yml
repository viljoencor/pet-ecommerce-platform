# deploy-cdk.yml
name: Deploy CDK Infrastructure
on:
  push:
    paths:
      - 'cdk/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - run: pip install -r cdk/requirements.txt
      - run: cdk synth
      - run: cdk deploy --require-approval never
